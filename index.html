<style>
/* ════════════════════════════════════════════════════════
   DESIGN SYSTEM — World-class polish layer
═══════════════════════════════════════════════════════════ */
:root {
  /* Spacing scale (4px base) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px;
  /* Type scale */
  --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:32px;
  /* Shadows — proper elevation system */
  --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --shadow-2: 0 2px 4px rgba(15,23,42,.05), 0 4px 8px rgba(15,23,42,.06);
  --shadow-3: 0 4px 8px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.08);
  --shadow-4: 0 12px 32px rgba(15,23,42,.10), 0 4px 12px rgba(15,23,42,.06);
  /* Easing */
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  /* Radii */
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-2xl:20px;
  /* Brand */
  --brand:#0d2818; --brand-2:#14532d; --brand-3:#15803d; --accent:#4ade80;
  --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
  --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155; --gray-800:#1e293b;
}
* { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { letter-spacing:-0.01em; }

/* Smooth scroll */
html { scroll-behavior: smooth; }

/* Refined focus states (accessibility) */
button:focus-visible, select:focus-visible, input:focus-visible, [onclick]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* Polished nav */
.nav { backdrop-filter: blur(8px); background: rgba(13,40,24,.96); }
.nav-brand h1 { letter-spacing:-.02em; }
.nav-link { transition:all .2s var(--ease); }
.nav-link::before {
  content:""; position:absolute; bottom:0; left:50%; width:0; height:3px;
  background:var(--accent); border-radius:3px 3px 0 0; transition:all .25s var(--ease);
  transform:translateX(-50%);
}
.nav-link.active::before { width:60%; }
.nav-link { position:relative; border-bottom:none !important; }
.nav-link.active { background:transparent !important; }

/* Refined search */
.gsearch-input { transition:all .25s var(--ease); }
.gsearch-shortcut {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  font-size:10px; color:rgba(255,255,255,.4); padding:2px 6px;
  border:1px solid rgba(255,255,255,.15); border-radius:4px;
  font-family:"SF Mono",monospace; pointer-events:none;
}
.gsearch-input:focus ~ .gsearch-shortcut { display:none; }

/* World-class home hero */
.home-hero { padding:80px 48px 64px; }
.home-hero h2 { letter-spacing:-.025em; font-size:42px; }
.home-hero p { font-size:13px; opacity:.9; }
.home-tagline { font-size:14px; opacity:.65; margin-top:18px; max-width:520px; margin-inline:auto; }

/* Stats bar refined */
.home-stats { padding:24px 48px; box-shadow: 0 1px 0 rgba(15,23,42,.04); }
.home-stat-n { letter-spacing:-.02em; }

/* Module cards — premium feel */
.home-modules { padding: 48px 48px 56px; gap: 24px; }
.module-card {
  border-radius: var(--r-lg);
  transition: all .3s var(--ease);
  border: 1px solid var(--gray-200);
  background: linear-gradient(180deg,#fff 0%,#fafaf7 100%);
}
.module-card:not(.disabled):hover { transform: translateY(-6px); box-shadow: var(--shadow-3); border-color:var(--accent); }
.module-icon { transition: transform .4s var(--ease-spring); }
.module-card:not(.disabled):hover .module-icon { transform: scale(1.1) rotate(-3deg); }
.module-info h3 { letter-spacing:-.015em; }

/* Refined badges */
.module-badge { padding:4px 12px; font-size:10px; letter-spacing:.03em; }

/* Polished filter pills */
.ot-filter-btn, .ot-afd-btn {
  transition: all .2s var(--ease);
  font-weight:500;
}
.ot-filter-btn:not(.active):hover, .ot-afd-btn:not(.active):hover {
  border-color: var(--brand-2);
  color: var(--brand-2);
}

/* Smooth tree animations */
.ot-root ul { transition: all .3s var(--ease); }
.ot-card { transition: all .25s var(--ease); }
.ot-card.ot-expanded { box-shadow: var(--shadow-2); }
.ot-expand-btn { transition: all .2s var(--ease); }
.ot-card.ot-expandable:hover .ot-expand-btn { background:#dcfce7; }

/* Refined cards across the app */
.eq-card, .veh-card, .trac-card {
  transition: all .25s var(--ease);
  border-radius: var(--r-md);
}
.eq-card:hover, .veh-card:hover, .trac-card:hover {
  border-color: var(--gray-300);
  box-shadow: var(--shadow-2);
}

/* Polished bates tabs */
.bates-tab {
  transition: all .2s var(--ease);
  letter-spacing: .01em;
}
.bates-tab.active { box-shadow: var(--shadow-1); }

/* Mobile responsiveness */
@media (max-width: 768px) {
  .nav { padding: 8px 16px; }
  .nav-brand { padding: 8px 16px; }
  .nav-brand h1 { font-size: 14px; }
  .nav-link { padding: 12px 14px; font-size: 12px; }
  .gsearch-wrap { padding: 6px 12px; }
  .gsearch-input { width: 140px; }
  .gsearch-input:focus { width: 180px; }
  .home-hero { padding: 48px 20px 40px; }
  .home-hero h2 { font-size: 26px; }
  .home-stats { padding: 16px 20px; gap: 20px; }
  .home-stat-n { font-size: 22px; }
  .home-modules { padding: 28px 20px; gap: 14px; grid-template-columns: 1fr; }
  .ot-toolbar { padding: 12px 16px; gap: 6px; }
  .ot-filter-btn, .ot-afd-btn { padding: 6px 12px; font-size: 11px; }
  .eq-toolbar, .vreg-toolbar, .trac-toolbar { padding: 12px 16px; }
  .eq-grid, .vreg-grid, .trac-grid { padding: 16px; }
  .tab-summary-bar { padding: 12px 16px; gap: 16px; }
  .bates-hdr { padding: 16px 20px; }
}

/* Print polish */
@media print {
  .nav, .gsearch-wrap, .ot-toolbar, .home-stats, .bates-hdr, .bates-nav, .bates-toolbar, .eq-toolbar, .vreg-toolbar, .trac-toolbar, .tab-summary-bar { display: none !important; }
  .home-hero { padding: 20px; background: #fff !important; color:#0d2818 !important; }
  .home-hero h2, .home-hero p, .home-tagline { color:#0d2818 !important; }
  .ot-card, .eq-card, .veh-card, .trac-card { box-shadow: none !important; border: 1px solid #999 !important; break-inside: avoid; }
  body { background: #fff; }
  @page { margin: 1cm; size: landscape; }
}

/* Subtle grain texture on backgrounds */
.bg-grain {
  position: relative;
}

/* Improved expand button */
.ot-expand-btn {
  background: var(--gray-100);
  border-color: var(--gray-200);
  color: var(--gray-600);
}
.ot-card.ot-expanded .ot-expand-btn {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}

/* Better card name readability */
.ot-name { letter-spacing: -.005em; }
.eq-card-name, .veh-card-name, .trac-card-name { letter-spacing:-.005em; }

/* Loading skeleton (for future use) */
@keyframes skeleton-shimmer {
  0% { background-position:-200px 0; }
  100% { background-position: calc(200px + 100%) 0; }
}
.skeleton {
  background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%);
  background-size: 400px 100%;
  animation: skeleton-shimmer 1.4s ease-in-out infinite;
}

/* ── ARBEID HEADER (consistent with Bates) ── */
.arbeid-hdr{background:linear-gradient(135deg,#0d2818 0%,#14532d 60%,#166534 100%);padding:22px 32px}
.arbeid-hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px}
.arbeid-hdr h2{font-family:"Playfair Display",serif;color:#fff;font-size:22px;letter-spacing:-.015em}
.arbeid-hdr p{color:#86efac;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.arbeid-stats{display:flex;gap:24px;flex-wrap:wrap}
.arbeid-stat{text-align:right;min-width:70px}
.arbeid-stat-n{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.02em}
.arbeid-stat-l{font-size:10px;color:#86efac;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

/* ── ORG TOOLBAR LAYOUT ── */
.ot-toolbar { row-gap: 8px; }
.ot-toolbar-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ot-toolbar-label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.ot-toolbar-divider{width:1px;background:#e0dbd0;height:22px}
.ot-toolbar-spacer{flex:1;min-width:8px}
.ot-action-btn{padding:7px 12px;border-radius:6px;border:1px solid #e0dbd0;background:#fff;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;color:#374151;cursor:pointer;transition:all .15s}
.ot-action-btn:hover{background:#f5f2eb;border-color:#14532d;color:#14532d}

/* ── BATES IN-TAB SEARCH ── */
.bates-search-wrap{position:relative;display:flex;align-items:center}
.bates-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:13px;pointer-events:none}
.bates-search-input{padding:7px 14px 7px 32px;border:1px solid #e0dbd0;border-radius:6px;font-family:"DM Sans",sans-serif;font-size:12px;color:#1a1a1a;background:#fff;outline:none;width:220px;transition:all .2s var(--ease)}
.bates-search-input::placeholder{color:#9ca3af}
.bates-search-input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.1);width:260px}

/* ── BATES EMPTY-STATE ── */
.bates-empty{flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;background:#f5f2eb;text-align:center;gap:14px}
.bates-empty-icon{font-size:40px;opacity:.4}
.bates-empty-msg{font-size:14px;font-weight:600;color:#6b7280}
.bates-empty-btn{padding:8px 18px;border-radius:6px;border:1px solid #1d4ed8;background:#1d4ed8;color:#fff;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.bates-empty-btn:hover{background:#1e40af;border-color:#1e40af}

/* ══════════════════════════════════════════════════════
   ARBEID — DASHBOARD + DRILL-DOWN
══════════════════════════════════════════════════════ */
.arbeid-view{background:#f5f2eb;min-height:400px;position:relative;overflow:hidden}

/* slide animasies */
@keyframes ad-slide-in-right{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes ad-slide-in-left{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
.ad-slide-right{animation:ad-slide-in-right .25s ease}
.ad-slide-left{animation:ad-slide-in-left .25s ease}

/* DASHBOARD */
.ad-dash{padding:20px 28px 32px}
.ad-section{margin-bottom:26px}
.ad-section-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-left:2px}

.ad-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ad-stat-card{background:#fff;border:1px solid #e0dbd0;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ad-stat-n{font-family:"Playfair Display",serif;font-size:32px;font-weight:700;color:#0d2818;line-height:1;letter-spacing:-.02em}
.ad-stat-l{font-size:10px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}

.ad-bar-list{background:#fff;border:1px solid #e0dbd0;border-radius:12px;padding:6px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ad-bar-row{padding:11px 16px;border-bottom:1px solid #f0ece6}
.ad-bar-row:last-child{border-bottom:none}
.ad-bar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.ad-bar-label{font-size:13px;font-weight:600;color:#1a1a1a}
.ad-bar-n{font-size:13px;font-weight:700;color:#374151;font-variant-numeric:tabular-nums}
.ad-bar-track{height:6px;background:#f1ede5;border-radius:4px;overflow:hidden}
.ad-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}

.ad-cta-wrap{margin-top:18px;display:flex;justify-content:center}
.ad-cta-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:8px;border:none;background:#14532d;color:#fff;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(20,83,45,.25);transition:all .15s}
.ad-cta-btn:hover{background:#166534;transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,83,45,.3)}

/* SKELETT LAAIER */
.ad-skel{background:linear-gradient(90deg,#ece8df 0%,#f5f2eb 50%,#ece8df 100%);background-size:200% 100%;animation:ad-skel-shimmer 1.5s infinite;border-radius:6px}
@keyframes ad-skel-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ad-skel-stat{height:74px;border-radius:12px}
.ad-skel-bar{height:46px;border-radius:8px;margin-bottom:6px}

/* DRILL-DOWN */
.ad-dd{padding:0 0 32px}
.ad-breadcrumb{padding:14px 28px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;background:#fff;border-bottom:1px solid #e0dbd0;position:sticky;top:50px;z-index:5}
.ad-bc-item{color:#15803d;cursor:pointer;font-weight:600;padding:3px 7px;border-radius:6px;transition:background .15s}
.ad-bc-item:hover{background:#f0f5ee}
.ad-bc-current{color:#1a1a1a;font-weight:700;padding:3px 7px}
.ad-bc-sep{color:#9ca3af;font-size:11px}
.ad-bc-back{display:inline-flex;align-items:center;gap:4px;color:#15803d;background:transparent;border:none;cursor:pointer;font-size:13px;font-weight:600;padding:3px 7px;border-radius:6px;font-family:"DM Sans",sans-serif}
.ad-bc-back:hover{background:#f0f5ee}

.ad-dd-list{padding:18px 28px}
.ad-dd-group{margin-bottom:22px}
.ad-dd-group-hdr{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ad-dd-group-count{background:#e0dbd0;color:#374151;font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px;letter-spacing:0;text-transform:none}

.ad-dd-cards{display:flex;flex-direction:column;gap:8px}
.ad-card{background:#fff;border:1px solid #e0dbd0;border-radius:10px;border-left:3px solid #94a3b8;padding:13px 14px 13px 14px;display:flex;align-items:flex-start;gap:11px;cursor:pointer;transition:all .15s;position:relative}
.ad-card.ad-card-leaf{cursor:default}
.ad-card:not(.ad-card-leaf):hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px);border-color:#cfc8b8}
.ad-card-body{flex:1;min-width:0}
.ad-card-name{font-size:14px;font-weight:700;color:#1a1a1a;line-height:1.25;margin-bottom:2px}
.ad-card-pos{font-size:12px;color:#374151;line-height:1.35;margin-bottom:4px}
.ad-card-meta{font-size:11px;color:#6b7280}
.ad-card-reports{font-size:11px;color:#15803d;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.ad-card-arrow{color:#9ca3af;font-size:18px;align-self:center;flex-shrink:0;font-weight:300}
.ad-init{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.02em}
.ad-kbadge{position:absolute;top:8px;right:10px;background:#fb923c;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.05em}

/* afdeling-kleure */
.ad-afd-Suiwel{border-left-color:#1d4ed8}
.ad-afd-Saai{border-left-color:#0f6e56}
.ad-afd-Wingerd{border-left-color:#7c3aed}
.ad-afd-Admin{border-left-color:#888780}

.ad-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;gap:14px;text-align:center;background:#f5f2eb;min-height:300px;cursor:pointer}
.ad-empty-icon{font-size:42px;opacity:.4}
.ad-empty-msg{font-size:14px;font-weight:600;color:#6b7280}
.ad-retry-btn{padding:8px 18px;border-radius:6px;border:1px solid #14532d;background:#14532d;color:#fff;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.ad-retry-btn:hover{background:#166534}

/* ── EXTRA MOBILE TWEAKS ── */
@media (max-width: 768px) {
  .arbeid-hdr { padding: 16px 18px; }
  .arbeid-hdr-top { gap: 12px; }
  .arbeid-hdr h2 { font-size: 18px; }
  .ad-dash { padding: 16px 14px 28px; }
  .ad-dd-list { padding: 14px 14px 24px; }
  .ad-breadcrumb { padding: 12px 14px 10px; }
  .ad-stat-n { font-size: 26px; }
  .bates-search-input, .bates-search-input:focus { width: 100%; }
  .bates-search-wrap { width: 100%; }
  .bates-toolbar-main { padding: 10px 14px; flex-direction: column; align-items: stretch; gap: 8px; }
  .bates-person-bar { padding: 6px 14px 10px; }
  .bates-nav { padding: 0 10px; }
  .bates-tab { padding: 10px 14px; font-size: 12px; }
  .eq-toolbar, .vreg-toolbar, .trac-toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
  .eq-filters, .vreg-filters, .trac-filters { width: 100%; }
  .eq-filters select, .vreg-filters select, .trac-filters select { flex: 1; min-width: 130px; }
}

/* ══════════════════════════════════
   ORG CHART STYLES
══════════════════════════════════ */
:root{
  --co:#0d2818;--dir:#2d1b69;--exec:#14532d;--fin:#1e3a5f;
  --dairy:#166534;--grain:#7c2d12;--vine:#713f12;--warn:#92400e;
  --bg:#f5f2eb;--card:#fff;--border:#e0dbd0;--text:#1a1a1a;--muted:#6b7280;
  --line:#cbd5e1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.hdr{background:var(--co);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr h1{font-family:"Playfair Display",serif;color:#fff;font-size:19px}
.hdr p{color:#86efac;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select{padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-family:"DM Sans",sans-serif;font-size:12px;cursor:pointer;outline:none}
select option{background:#1a3d2b;color:#fff}
.btn{padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:"DM Sans",sans-serif;transition:all .15s}
.btn-sm{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-sm:hover{background:rgba(255,255,255,.25)}
.btn-sm.active{background:rgba(255,255,255,.35)}
.btn-print{background:#15803d;color:#fff}

.stats{background:#fff;border-bottom:1px solid var(--border);padding:10px 28px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:8px}
.stat-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.stat-n{font-size:16px;font-weight:600}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

.legend{display:flex;flex-wrap:wrap;gap:10px;padding:8px 28px;background:#fff;border-bottom:1px solid var(--border)}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:2px}

/* CHART */
.chart-outer{padding:28px;overflow-x:auto}
.chart-inner{position:relative;min-width:100%}
svg.lines{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}

/* ROWS */
.org-row{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:40px;position:relative;z-index:2}
.org-row.all-hidden{display:none!important}

/* SECTION ROWS — sub-groups sit in their own row per manager-section */
.section-wrap{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;margin-bottom:40px}
.section-wrap.hidden-section{display:none!important}
.section-mgr{display:flex;justify-content:center;margin-bottom:0}
.section-groups{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:36px;position:relative;z-index:2}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-top:3px solid #ccc;border-radius:8px;padding:10px 13px;min-width:165px;max-width:205px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;transition:box-shadow .15s,transform .1s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.11);transform:translateY(-2px)}
.card-name{font-size:12px;font-weight:600;line-height:1.3;color:var(--text)}
.card-title{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.card-loc{font-size:9px;color:var(--muted);margin-top:4px;font-style:italic}
.card-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;margin-top:5px;display:inline-block}
.badge-count{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.badge-warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.badge-contract{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.card.hidden{display:none !important}
.worker-group{border-style:dashed;opacity:.88}.worker-group.hidden{display:none !important}.worker-group .card-title{max-height:48px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

.d-company{border-top-color:var(--co);background:var(--co);min-width:270px;max-width:330px}
.d-company .card-name{color:#fff;font-size:14px;font-family:"Playfair Display",serif}
.d-company .card-title{color:#86efac}
.d-direksie{border-top-color:var(--dir)}
.d-exec{border-top-color:var(--exec)}
.d-finance{border-top-color:var(--fin)}
.d-warn{border-top-color:var(--warn);background:#fffdf5}
.d-suiwel-mgr{border-top-color:var(--dairy)}
.d-dairy-w{border-top-color:#4ade80;background:#f9fffe}
.d-grain{border-top-color:var(--grain)}
.d-grain-w{border-top-color:#fb923c;background:#fffcfa}
.d-wingerd{border-top-color:var(--vine);background:#fffdf0}
.d-vine-w{border-top-color:#ca8a04;background:#fffef0}

.bates-hdr{background:linear-gradient(135deg,#1e3a5f 0%,#1d4ed8 100%);padding:22px 32px}
.bates-hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.bates-hdr h2{font-family:"Playfair Display",serif;color:#fff;font-size:22px}
.bates-hdr p{color:#bfdbfe;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

.bates-tab{padding:13px 22px;border:none;border-bottom:2px solid transparent;background:transparent;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:8px;margin-bottom:-2px;white-space:nowrap}

/* Bates unified toolbar */
.bates-toolbar{background:#fff;border-bottom:1px solid #e0dbd0}
.bates-toolbar-main{padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ══════════════════════════════════
   CSS ORG TREE
══════════════════════════════════ */
:root { --lc: #94a3b8; --lw: 2px; --lh: 32px; }
.ot-wrap { overflow-x: auto; padding: 28px 16px 40px; background: #f5f2eb; min-height: 300px; }
.ot-toolbar { display:flex; align-items:center; gap:10px; padding:12px 28px; background:#fff; border-bottom:1px solid #e0dbd0; flex-wrap:wrap; }
.ot-filter-btn, .ot-afd-btn { padding:7px 16px; border-radius:20px; border:1px solid #e0dbd0; background:#fff; font-family:"DM Sans",sans-serif; font-size:12px; font-weight:500; cursor:pointer; color:#374151; transition:all .15s; }
.ot-filter-btn:hover, .ot-afd-btn:hover { background:#f5f2eb; }
.ot-filter-btn.active, .ot-afd-btn.active { background:#0d2818; color:#fff; border-color:#0d2818; }

/* Tree structure */
.ot-root { display:flex; justify-content:center; }
.ot-root ul, .ot-root li { list-style:none; margin:0; padding:0; }
.ot-root ul { display:flex; justify-content:center; position:relative; padding-top:var(--lh); gap:4px; flex-wrap:wrap; }
.ot-root ul.ot-collapsed { display:none; }
.ot-root ul:not(.ot-collapsed) { animation: tree-expand .3s var(--ease); }
@keyframes tree-expand {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ot-root ul::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:var(--lw); height:var(--lh); background:var(--lc);
}
.ot-root > ul::before { display:none; }
.ot-root li {
  display:flex; flex-direction:column; align-items:center; position:relative; padding:var(--lh) 8px 0;
}
.ot-root > ul > li { padding-top:0; } /* root company node */
.ot-root li::before {
  content:''; position:absolute; top:0; right:50%; width:50%; height:var(--lh);
  border-top:var(--lw) solid var(--lc); border-right:var(--lw) solid var(--lc);
}
.ot-root li::after {
  content:''; position:absolute; top:0; left:50%; width:50%; height:var(--lh);
  border-top:var(--lw) solid var(--lc); border-left:var(--lw) solid var(--lc);
}
.ot-root li.ot-li-first::before { border:none; }
.ot-root li.ot-li-last::after { border:none; }
.ot-root li.ot-li-only::before, .ot-root li.ot-li-only::after { border:none; }

/* Cards */
.ot-card {
  background:#fff; border:1px solid #e0dbd0; border-radius:10px; border-top:3px solid #ccc;
  padding:10px 14px; min-width:165px; max-width:210px; text-align:left;
  box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:default;
  transition:box-shadow .15s, transform .1s;
}
.ot-card:hover { box-shadow:0 4px 14px rgba(0,0,0,.1); transform:translateY(-2px); }
.ot-card.ot-worker { border-style:dashed; opacity:.85; }
.ot-li-worker { padding-top:16px; }
.ot-li-contract { padding-top:16px; }
.ot-card.ot-contract { border-style:dashed; border-top-color:#3b82f6; background:#f0f7ff; }
.ot-name { font-size:13px; font-weight:600; color:#1a1a1a; line-height:1.3; margin-bottom:3px; }
.ot-title { font-size:10px; color:#6b7280; line-height:1.3; margin-bottom:4px; }
.ot-loc { font-size:10px; color:#9ca3af; margin-top:3px; font-style:italic; }
.ot-names { font-size:10px; color:#9ca3af; margin-top:2px; line-height:1.3; max-height:32px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.ot-badge { font-size:9px; font-weight:600; padding:2px 7px; border-radius:10px; margin-top:5px; display:inline-block; }
.ot-badge-count { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
.ot-badge-warn  { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
.ot-badge-contract { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }

/* Dept colours */
.ot-company { border-top-color:#0d2818; background:#0d2818; min-width:240px; }
.ot-company .ot-name  { color:#fff; font-size:14px; font-family:"Playfair Display",serif; }
.ot-company .ot-title { color:#86efac; }
.ot-dir     { border-top-color:#2d1b69; }

function showPage(id){

  if(svg && id!=="arbeid") svg.innerHTML="";
  document.getElementById("app").innerHTML = PAGES[id] || "";
  document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));
  const link = document.getElementById("link-"+id);
  if(link) link.classList.add("active");
  window.scrollTo(0,0);
  if(id==="arbeid") setTimeout(initArbeid, 150);
  if(id==="home")   setTimeout(initHome, 100);
  if(id==="bates")  setTimeout(initBates, 100);
}

function getPos(el,cont){
  const e=el.getBoundingClientRect(),c=cont.getBoundingClientRect();
  return{x:e.left-c.left+e.width/2,top:e.top-c.top,bottom:e.top-c.top+e.height};
}

function drawLines(){
  const svg=document.getElementById("svgLines");
  const cont=document.getElementById("chartInner");
  if(!svg||!cont)return;
  svg.innerHTML="";
  document.querySelectorAll(".card:not(.hidden)").forEach(card=>{
    const pid=card.dataset.parent;
    if(!pid)return;
    const par=document.getElementById(pid);
    if(!par||par.classList.contains("hidden"))return;
    const p=getPos(par,cont),ch=getPos(card,cont);
    const midY=p.bottom+(ch.top-p.bottom)/2;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M${p.x} ${p.bottom}L${p.x} ${midY}L${ch.x} ${midY}L${ch.x} ${ch.top}`);
    path.setAttribute("fill","none");
    const isContract=card.id.startsWith("gc_");
    path.setAttribute("stroke",isContract?"#3b82f6":"#94a3b8");
    path.setAttribute("stroke-width",isContract?"1.5":"2");
    if(isContract)path.setAttribute("stroke-dasharray","5 3");
    svg.appendChild(path);
  });
  const h=cont.scrollHeight;
  svg.setAttribute("height",h);
  svg.setAttribute("viewBox",`0 0 ${cont.scrollWidth} ${h}`);
}

let workersOn=true,contractOn=true,deptVal="all",locVal="all";

function applyFilters(){
  // ot-tree workers
  document.querySelectorAll("[data-worker='1']").forEach(li=>{
    li.style.display = workersOn ? "" : "none";
  });
  document.querySelectorAll("[data-contract='1']").forEach(li=>{
    li.style.display = contractOn ? "" : "none";
  });
  // Also hide ot-card worker elements directly
  document.querySelectorAll(".ot-worker").forEach(c=>{
    const li = c.closest("li[data-worker]");
    if(!li) c.style.display = workersOn ? "" : "none";
  });
  document.querySelectorAll(".ot-contract").forEach(c=>{
    const li = c.closest("li[data-contract]");
    if(!li) c.style.display = contractOn ? "" : "none";
  });

  if(!document.getElementById("deptFilter"))return;
  deptVal=document.getElementById("deptFilter").value;
  locVal=document.getElementById("locFilter").value;
  document.querySelectorAll(".card").forEach(card=>{
    const f=card.dataset.filter||"all";
    const l=card.dataset.loc||"";
    const isTop=card.id==="CO";
    const isDir=f==="direksie"||isTop;
    const isW=card.classList.contains("worker-group")||card.dataset.workers==="1";
    const isCt=card.id.startsWith("gc_");
    let show=true;
    if(deptVal!=="all"&&!isTop&&!isDir) show=show&&(f===deptVal);
    if(locVal!=="all"&&!isTop&&!isDir) show=show&&l.includes(locVal.split("/")[0].trim().split(" ")[0]);
    if(isW&&!isCt) show=show&&workersOn;
    if(isCt) show=show&&contractOn;
    card.classList.toggle("hidden",!show);
  });
  document.querySelectorAll(".org-row").forEach(row=>{
    const any=Array.from(row.querySelectorAll(".card")).some(c=>!c.classList.contains("hidden"));
    row.classList.toggle("all-hidden",!any);
  });
  setTimeout(drawLines,60);
  updateConnectors();
}

function toggleWorkers(){const cb=document.getElementById("btnW");workersOn=cb?cb.checked:!workersOn;applyFilters();}
function toggleContract(){const cb=document.getElementById("btnC");contractOn=cb?cb.checked:!contractOn;applyFilters();}

function updateArbeidStats(){
  const el = document.getElementById("arbeidStats");
  if(!el) return;
  // Count managers, supervisors, worker groups, contractors directly from the tree
  const dirs       = document.querySelectorAll(".ot-root .ot-dir").length;
  const execs      = document.querySelectorAll(".ot-root .ot-exec, .ot-root .ot-suiwel, .ot-root .ot-fin, .ot-root .ot-wingerd, .ot-root .ot-grain, .ot-root .ot-dairy").length;
  // Count workers from group cards (the count is in parens in the name, e.g. "Bonnievale – Wingerd (7)")
  let workers = 0, contractors = 0;
  document.querySelectorAll(".ot-root .ot-worker .ot-name").forEach(n => {
    const m = n.textContent.match(/\((\d+)\)/);
    if(m) workers += parseInt(m[1], 10);
  });
  document.querySelectorAll(".ot-root .ot-contract .ot-name").forEach(n => {
    const m = n.textContent.match(/\((\d+)\)/);
    if(m) contractors += parseInt(m[1], 10);
  });
  const stats = [
    {n: dirs,        l: "Direkteure"},
    {n: execs,       l: "Bestuur & Toesig"},
    {n: workers,     l: "Werkers"},
    {n: contractors, l: "Kontrakteurs"},
  ];
  el.innerHTML = stats.map(s =>
    `<div class="arbeid-stat"><div class="arbeid-stat-n">${s.n}</div><div class="arbeid-stat-l">${s.l}</div></div>`
  ).join("");
}

function ad_init(naam){
  if(!naam) return '—';
  const parts = naam.trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function ad_afdColor(afd){ return AFD_COLORS[afd] || '#94a3b8'; }

function ad_directReports(naam){
  return ARBEID_DATA.filter(e => e.raporteerAan === naam);

// ── DASHBOARD ──────────────────────────────────────────
function renderArbeidDashboard(){
  const view = document.getElementById('arbeid-dashboard-view');
  if(!view) return;

  if(!ARBEID_DATA.length){
    view.innerHTML = `<div class="ad-empty" onclick="verfrisData()">
      <div class="ad-empty-icon">&#128225;</div>
      <div class="ad-empty-msg">Geen data beskikbaar — klik om te verfris</div>
      <button class="ad-retry-btn" onclick="event.stopPropagation();verfrisData()">&#8635; Verfris</button>
    </div>`;
    return;
  }

  const data = ARBEID_DATA;
  const w = data.filter(e => e.tipe === 'Werknemer').length;
  const k = data.filter(e => e.tipe === 'Kontrakteur').length;
  const plase = [...new Set(data.map(e => e.plaas).filter(Boolean))];
  const vlakke = [...new Set(data.map(e => e.vlak).filter(Boolean))];

  const tellings = (sleutel) => {
    const m = {};
    data.forEach(e => {
      const v = e[sleutel] || '—';
      m[v] = (m[v] || 0) + 1;
    });
    return Object.entries(m).sort((a,b) => b[1] - a[1]);
  };

  const afdData = tellings('afdeling');

  data.forEach(e => {

  const vlakOrder = ['Vlak 1','Vlak 2','Vlak 3','Vlak 4','Vlak 5'];

  const maxAfd = Math.max(...afdData.map(d => d[1]), 1);
  const maxPlaas = Math.max(...plaasData.map(d => d[1]), 1);
  const maxVlak = Math.max(...vlakData.map(d => d[1]), 1);

  const balkBlok = (rye, kleurFn, maks) => `

            <span class="ad-bar-n">${n}</span>

    <div class="ad-section">
      <div class="ad-stat-grid">
        <div class="ad-stat-card"><div class="ad-stat-n">${w}</div><div class="ad-stat-l">Werknemers</div></div>

        <div class="ad-stat-card"><div class="ad-stat-n">${plase.length}</div><div class="ad-stat-l">Plase aktief</div></div>
        <div class="ad-stat-card"><div class="ad-stat-n">${vlakke.length}</div><div class="ad-stat-l">Vlakke</div></div>
      </div>
    </div>
    <div class="ad-section">
      <div class="ad-section-title">Per Afdeling</div>
      ${balkBlok(afdData, ad_afdColor, maxAfd)}
    </div>
    <div class="ad-section">
      <div class="ad-section-title">Per Plaas</div>
      ${balkBlok(plaasData, () => '#475569', maxPlaas)}
    </div>
    <div class="ad-section">
      <div class="ad-section-title">Per Vlak</div>

      <button class="ad-cta-btn" onclick="arbeidGaanNaDrill()">Bekyk Personeel &rarr;</button>

// ── DRILL-DOWN ─────────────────────────────────────────
function arbeidGaanNaDrill(){
  arbeidPath = [];
  arbeidViewMode = 'drill';
  document.getElementById('arbeid-dashboard-view').style.display = 'none';
  const dd = document.getElementById('arbeid-drilldown-view');
  dd.style.display = '';
  renderArbeidDrill('right');
}

function arbeidTerugDashboard(){
  arbeidViewMode = 'dash';
  arbeidPath = [];
  document.getElementById('arbeid-drilldown-view').style.display = 'none';
  const dv = document.getElementById('arbeid-dashboard-view');
  dv.style.display = '';
  renderArbeidDashboard();
}

function arbeidDrillIn(naam){
  arbeidPath.push(naam);
  renderArbeidDrill('right');
}

function arbeidBcKlik(idx){
  if(idx < 0) arbeidPath = [];
  else arbeidPath = arbeidPath.slice(0, idx + 1);
  renderArbeidDrill('left');
}

function renderArbeidDrill(richting){
  const view = document.getElementById('arbeid-drilldown-view');
  if(!view) return;

  if(!ARBEID_DATA.length){
    view.innerHTML = `<div class="ad-empty" onclick="verfrisData()">
      <div class="ad-empty-icon">&#128225;</div>
      <div class="ad-empty-msg">Geen data beskikbaar — klik om te verfris</div>
    </div>`;
    return;
  }

  let employees;
  if(arbeidPath.length === 0){
    employees = ARBEID_DATA.filter(e => e.vlak === 'Vlak 1');
  } else {
    const huidige = arbeidPath[arbeidPath.length - 1];
    employees = ARBEID_DATA.filter(e => e.raporteerAan === huidige);
  }

  const bcParts = [`<button class="ad-bc-back" onclick="arbeidTerugDashboard()">&#8592; Dashboard</button>`,
                   `<span class="ad-bc-sep">/</span>`,
                   `<span class="ad-bc-item" onclick="arbeidBcKlik(-1)">FO Seuns</span>`];
  arbeidPath.forEach((naam, i) => {
    const eersteN = naam.split(/\s+/)[0];
    bcParts.push(`<span class="ad-bc-sep">&rsaquo;</span>`);
    if(i === arbeidPath.length - 1){
      bcParts.push(`<span class="ad-bc-current">${eersteN}</span>`);
    } else {
      bcParts.push(`<span class="ad-bc-item" onclick="arbeidBcKlik(${i})">${eersteN}</span>`);
    }
  });

  let lysHtml = '';
  if(!employees.length){
    lysHtml = `<div class="ad-empty" style="background:transparent;min-height:200px;padding:50px 24px">
      <div class="ad-empty-icon">&#128101;</div>
      <div class="ad-empty-msg">Geen direkte rapporte nie</div>
    </div>`;
  } else if(arbeidPath.length === 0){
    lysHtml = `<div class="ad-dd-cards">${employees.map(renderArbeidCard).join('')}</div>`;
  } else {
    const groepe = {'Vlak 2':[], 'Vlak 3':[], 'Vlak 5':[], 'Kontrakteurs':[], 'Ander':[]};
    employees.forEach(e => {
      if(e.tipe === 'Kontrakteur') groepe['Kontrakteurs'].push(e);
      else if(groepe[e.vlak]) groepe[e.vlak].push(e);
      else groepe['Ander'].push(e);
    });
    lysHtml = DRILL_GROUP_ORDER.concat(['Ander']).filter(g => groepe[g] && groepe[g].length).map(g => {
      const label = DRILL_GROUP_LABELS[g] || g;
      return `<div class="ad-dd-group">
        <div class="ad-dd-group-hdr">${label}<span class="ad-dd-group-count">${groepe[g].length}</span></div>
        <div class="ad-dd-cards">${groepe[g].map(renderArbeidCard).join('')}</div>
      </div>`;
    }).join('');
  }

  const animKlas = richting === 'left' ? 'ad-slide-left' : 'ad-slide-right';
  view.innerHTML = `<div class="ad-dd">
    <div class="ad-breadcrumb">${bcParts.join('')}</div>
    <div class="ad-dd-list ${animKlas}">${lysHtml}</div>
  </div>`;
}

function renderArbeidCard(e){
  const afd = e.afdeling || '';
  const kleur = ad_afdColor(afd);
  const reports = ad_directReports(e.naam);
  const heeftReports = reports.length > 0;
  const isKontrak = e.tipe === 'Kontrakteur';
  const klikbaar = heeftReports;
  const klas = `ad-card ad-afd-${afd}${klikbaar ? '' : ' ad-card-leaf'}`;
  const onclick = klikbaar ? `onclick="arbeidDrillIn('${(e.naam||'').replace(/'/g,"\\'")}')"` : '';
  return `<div class="${klas}" ${onclick}>
    <div class="ad-init" style="background:${kleur}">${ad_init(e.naam)}</div>
    <div class="ad-card-body">
      <div class="ad-card-name">${e.naam || '—'}</div>
      ${e.posbeskrywing ? `<div class="ad-card-pos">${e.posbeskrywing}</div>` : ''}
      <div class="ad-card-meta">${[afd, e.plaas].filter(Boolean).join(' · ')}</div>
      ${heeftReports ? `<div class="ad-card-reports">${reports.length} direkte ${reports.length===1?'rapport':'rapporte'} &rarr;</div>` : ''}
    </div>
    ${klikbaar ? `<div class="ad-card-arrow">&rsaquo;</div>` : ''}
    ${isKontrak ? `<div class="ad-kbadge">Kontrakteur</div>` : ''}
  </div>`;
}

// ── SOEK-INTEGRASIE: Wys plat lys binne drill-down skerm ──
function renderArbeidSoekResultate(query){
  const view = document.getElementById('arbeid-drilldown-view');
  if(!view) return;
  const q = (query || '').trim().toLowerCase();
  if(!q){
    arbeidSoekActief = false;
    if(arbeidViewMode === 'drill') renderArbeidDrill('left');
    else { view.style.display = 'none'; document.getElementById('arbeid-dashboard-view').style.display = ''; renderArbeidDashboard(); }
    return;
  }
  arbeidSoekActief = true;
  document.getElementById('arbeid-dashboard-view').style.display = 'none';
  view.style.display = '';
  const matches = ARBEID_DATA.filter(e => {
    const t = [e.naam, e.posbeskrywing, e.plaas].filter(Boolean).join(' ').toLowerCase();
    return t.includes(q);
  });
  const lys = matches.length
    ? `<div class="ad-dd-cards">${matches.map(renderArbeidCard).join('')}</div>`
    : `<div class="ad-empty" style="background:transparent;min-height:200px;padding:50px 24px">
        <div class="ad-empty-icon">&#128269;</div>
        <div class="ad-empty-msg">Geen werknemers pas by "${query}" nie</div>
       </div>`;
  view.innerHTML = `<div class="ad-dd">
    <div class="ad-breadcrumb">
      <button class="ad-bc-back" onclick="arbeidTerugDashboard()">&#8592; Dashboard</button>
      <span class="ad-bc-sep">/</span>
      <span class="ad-bc-current">Soekresultate (${matches.length})</span>
    </div>
    <div class="ad-dd-list ad-slide-left">${lys}</div>
  </div>`;
}

// ── INISIALISERING ─────────────────────────────────────
function buildArbeidGrid(employees){
  ARBEID_DATA = employees || [];
  herbouSoekIndeks(ARBEID_DATA);
  if(arbeidViewMode === 'drill') renderArbeidDrill('left');
  else renderArbeidDashboard();
}

function initArbeid(){
  arbeidViewMode = 'dash';
  arbeidPath = [];
  arbeidSoekActief = false;
  const dv = document.getElementById('arbeid-dashboard-view');
  const dd = document.getElementById('arbeid-drilldown-view');
  if(dv) dv.style.display = '';
  if(dd) dd.style.display = 'none';

  if(ARBEID_DATA.length){
    renderArbeidDashboard();
    return;
  }
  const kas = bsLeesKas();
  if(kas?.employees?.length){
    ARBEID_DATA = kas.employees;
    herbouSoekIndeks(ARBEID_DATA);
    renderArbeidDashboard();
    return;
  }
  renderArbeidSkelett();
  setTimeout(() => {
    if(!ARBEID_DATA.length) renderArbeidDashboard();
  }, 1500);
}

function herbouSoekIndeks(employees){
  const bates = SEARCH_INDEX.filter(e=>e.page!=='arbeid');
  const arbeid = (employees || [])
    .filter(e=>e.naam)
    .map(e=>({
      label: e.naam,
      sub: [e.posbeskrywing,e.plaas].filter(Boolean).join(' · '),
      page: 'arbeid', type: 'Arbeid'
    }));
  SEARCH_INDEX.splice(0, SEARCH_INDEX.length, ...bates, ...arbeid);
}

const AFD_CLASS = {
  "Saai en Meganies": "afd-saai",
  "Suiwel": "afd-suiwel",
  "Wingerd": "afd-wingerd"
};

function buildEquipmentGrid(data){
  const grid = document.getElementById("eqGrid");
  if(!grid) return;

  // Group by classification
  const grouped = {};
  data.forEach(item => {
    if(!grouped[item.classification]) grouped[item.classification] = [];
    grouped[item.classification].push(item);
  });

  const classes = Object.keys(grouped).sort();
  grid.innerHTML = classes.map(cls => {
    const items = grouped[cls];
    const cards = items.map(item => {
      const afdClass = AFD_CLASS[item.afdeling] || "";
      return `<div class="eq-card ${afdClass}"
        data-afdeling="${item.afdeling}"
        data-plaas="${item.plaas}"
        data-verant="${item.verantwoordelike}"
        data-class="${item.classification}">
        <div class="eq-card-code">${item.code}</div>
        <div class="eq-card-name">${item.name}</div>
        <div class="eq-card-meta-row"><span>&#128205;</span>${item.plaas}</div>
        <div class="eq-card-meta-row"><span>&#128100;</span>${item.verantwoordelike}</div>
        <div class="eq-afd-badge">${item.afdeling}</div>
      </div>`;
    }).join("");
    return `<div class="eq-section" id="sec-${cls.replace(/\/|\s/g,'-')}">
      <div class="eq-section-hdr">
        <span class="eq-section-title">${cls}</span>
        <span class="eq-section-count">${items.length}</span>
        <div class="eq-section-line"></div>
      </div>
      <div class="eq-cards">${cards}</div>
    </div>`;
  }).join("");

  updateEqStats(data.length);
}

function updateEqStats(visible){
  const el = document.getElementById("eqStats");
  if(!el) return;
  const total = EQ_DATA.length;
  const afds = [...new Set(EQ_DATA.map(i=>i.afdeling))].length;
  el.innerHTML = [
    {n: visible === total ? total : visible + "/" + total, l: "Implemente"},
    {n: [...new Set(EQ_DATA.map(i=>i.classification))].length, l: "Klassifikasies"},
    {n: afds, l: "Afdelings"},
    {n: [...new Set(EQ_DATA.map(i=>i.verantwoordelike))].length, l: "Verantwoordelikes"},
  ].map(s=>`<div><div class="eq-stat-n" style="font-size:22px;font-weight:700;color:#7c2d12;line-height:1">${s.n}</div><div class="eq-stat-l" style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-top:2px">${s.l}</div></div>`).join("");
}

function filterEquipment(){
  const ver  = eqPersonFilter;
  const cls  = document.getElementById("fClass")?.value || "";
  const q    = (document.getElementById("eqSearch")?.value || "").trim().toLowerCase();

  let visible = 0;
  document.querySelectorAll(".eq-card").forEach(card => {
    const name = card.querySelector(".eq-card-name")?.textContent.toLowerCase() || "";
    const code = card.querySelector(".eq-card-code")?.textContent.toLowerCase() || "";
    const show = (!ver  || card.dataset.verant   === ver)
              && (!cls  || card.dataset.class    === cls)
              && (!q    || name.includes(q) || code.includes(q));
    card.classList.toggle("hidden", !show);
    if(show) visible++;
  });

  // Hide empty sections
  document.querySelectorAll(".eq-section").forEach(sec => {
    const any = Array.from(sec.querySelectorAll(".eq-card")).some(c=>!c.classList.contains("hidden"));
    sec.classList.toggle("all-hidden", !any);
  });

  const empty = document.getElementById("eqEmpty");
  const grid  = document.getElementById("eqGrid");
  if(empty && grid){
    empty.style.display = visible === 0 ? "flex" : "none";
    grid.style.display  = visible === 0 ? "none" : "";
  }

  updateEqStats(visible);
}

function resetFilters(){
  eqPersonFilter = '';
  ["fClass","eqSearch"].forEach(id => { const el=document.getElementById(id); if(el) el.value=""; });
  document.querySelectorAll(".bpill[id^='eqP-']").forEach(b=>b.classList.remove("active"));
  const ap = document.getElementById("eqP-all"); if(ap) ap.classList.add("active");
  filterEquipment();
}

function setEqPerson(person, btn){

  if(btn) btn.classList.add("active");
  filterEquipment();
}
function setTracPerson(person, btn){

  document.querySelectorAll(".bpill[id^='tracP-']").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  filterTractors();
}
function setVehKlas(klas, btn){
  vehKlasFilter = klas;
  document.querySelectorAll(".bpill[id^='vehK-']").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  filterVehicles();
}

function updateBatesTabCounts(){
  const eq  = document.getElementById("btab-eq-n");
  const tr  = document.getElementById("btab-trac-n");
  const vh  = document.getElementById("btab-veh-n");
  if(eq)  eq.textContent  = EQ_DATA.length;
  if(tr)  tr.textContent  = TRAC_DATA.length;
  if(vh)  vh.textContent  = VEH_DATA.length;
}

function switchBatesTab(tab){
  ["equipment","tractors","vehicles"].forEach(t => {
    const el = document.getElementById("bates-"+t);
    if(el) el.style.display = t===tab ? "block" : "none";
    const btn = document.getElementById("tab-"+t);
    if(btn) btn.classList.toggle("active", t===tab);
  });
  if(tab==="equipment") buildEquipmentGrid(EQ_DATA);
  if(tab==="vehicles")  buildVehicleGrid(VEH_DATA);
  if(tab==="tractors")  buildTractorGrid(TRAC_DATA);
}

function initBates(){
  updateBatesTabCounts();
  switchBatesTab("equipment");
}

const VEH_AFD_CLASS = {
  "Hoofkantoor":"vafd-hoofkantoor",
  "Suiwel":"vafd-suiwel",
  "Saai":"vafd-saai",
  "Meganies":"vafd-meganies",
  "Wingerd":"vafd-wingerd"
};

function buildVehicleGrid(data){
  const grid = document.getElementById("vehGrid");
  if(!grid) return;
  const grouped = {};
  data.forEach(v=>{
    const key = 'Klas ' + v.klas;
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(v);
  });
  const afds = ['Klas A','Klas B','Klas C','Klas D'].filter(k=>grouped[k]);
  grid.innerHTML = afds.map(afd=>{
    const items = grouped[afd];
    const cards = items.map(v=>{
      const afdCls = VEH_AFD_CLASS[v.afdeling]||"";
      return `<div class="veh-card ${afdCls}"
        data-afdeling="${v.afdeling}"
        data-plaas="${v.plaas}"
        data-verant="${v.verantwoordelike}"
        data-klas="${v.klas}">
        <div class="veh-card-top">
          <div class="veh-card-code">${v.code}</div>
          <span class="veh-klas klas-${v.klas}">Klas ${v.klas}</span>
        </div>
        <div class="veh-card-name">${v.name}</div>
        <div class="veh-card-row">&#128205; ${v.plaas}</div>
        <div class="veh-card-row">&#128100; ${v.verantwoordelike}</div>
        <div class="veh-card-row">&#128197; ${v.jaar}</div>
        <div class="veh-card-row">&#128197; Aangekoop: ${v.aankoop}</div>
        <div class="veh-afd-badge">${v.afdeling}</div>
      </div>`;
    }).join("");
    return `<div class="vreg-section" id="vsec-${afd.replace(/ /g,'-')}">
      <div class="vreg-section-hdr">
        <span class="vreg-section-title">${afd}</span>
        <span class="vreg-section-count">${items.length}</span>
        <div class="vreg-section-line"></div>
      </div>
      <div class="vreg-cards">${cards}</div>
    </div>`;
  }).join("");
  updateVehStats(data.length);
}

function updateVehStats(visible){
  const el=document.getElementById("vehStats");
  if(!el)return;
  const total=VEH_DATA.length;
  el.innerHTML=[
    {n:visible===total?total:visible+"/"+total,l:"Voertuie"},
    {n:[...new Set(VEH_DATA.map(v=>v.klas))].length,l:"Klasse"},
    {n:[...new Set(VEH_DATA.map(v=>v.afdeling))].length,l:"Afdelings"},
    {n:[...new Set(VEH_DATA.map(v=>v.verantwoordelike))].length,l:"Verantwoordelikes"},
  ].map(s=>`<div><div style="font-size:22px;font-weight:700;color:#1e3a5f;line-height:1">${s.n}</div><div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-top:2px">${s.l}</div></div>`).join("");
}

function filterVehicles(){
  const afd=document.getElementById("vfAfdeling")?.value||"";
  const klas=vehKlasFilter;
  const q=(document.getElementById("vehSearch")?.value||"").trim().toLowerCase();
  let visible=0;
  document.querySelectorAll(".veh-card").forEach(card=>{
    const name=card.querySelector(".veh-card-name")?.textContent.toLowerCase()||"";
    const code=card.querySelector(".veh-card-code")?.textContent.toLowerCase()||"";
    const show=(!afd||card.dataset.afdeling===afd)
            &&(!klas||card.dataset.klas===klas)
            &&(!q||name.includes(q)||code.includes(q));
    card.classList.toggle("hidden",!show);
    if(show)visible++;
  });
  document.querySelectorAll(".vreg-section").forEach(sec=>{
    const any=Array.from(sec.querySelectorAll(".veh-card")).some(c=>!c.classList.contains("hidden"));
    sec.classList.toggle("all-hidden",!any);
  });
  const empty=document.getElementById("vehEmpty");
  const grid=document.getElementById("vehGrid");
  if(empty&&grid){
    empty.style.display = visible===0 ? "flex" : "none";
    grid.style.display  = visible===0 ? "none" : "";
  }
  updateVehStats(visible);
}

function resetVehFilters(){
  vehKlasFilter = '';
  ["vfAfdeling","vehSearch"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
  document.querySelectorAll(".bpill[id^='vehK-']").forEach(b=>b.classList.remove("active"));
  const ap=document.getElementById("vehK-all"); if(ap) ap.classList.add("active");
  filterVehicles();
}

const TYPE_COLORS = {
  "Arbeid":     {bg:"#dcfce7",color:"#14532d",icon:"&#128119;"},
  "Implemente": {bg:"#ffedd5",color:"#7c2d12",icon:"&#9881;"},
  "Voertuie":   {bg:"#dbeafe",color:"#1e3a5f",icon:"&#128665;"},
  "Trekkers":   {bg:"#dcfce7",color:"#14532d",icon:"&#128668;"},
};

let gSearchActive = -1;
let gSearchResults = [];

function highlight(text, query) {
  if(!query) return text;
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(esc,'gi'), m=>`<span class="gsearch-highlight">${m}</span>`);
}

function onGSearch(val) {
  const q = val.trim().toLowerCase();
  const clear = document.getElementById("gSearchClear");
  if(clear) clear.style.display = q ? "block" : "none";

  // As ons op Arbeid-bladsy is, wys ook 'n plat lys van werknemers
  if(document.getElementById("arbeid-dashboard-view")) {
    renderArbeidSoekResultate(val);
  }

  if(!q) { closeGSearch(); return; }

  gSearchResults = SEARCH_INDEX.filter(item =>
    item.label.toLowerCase().includes(q) ||
    item.sub.toLowerCase().includes(q) ||
    (item.type && item.type.toLowerCase().includes(q))
  ).slice(0, 12);

  renderGSearch(q);
}

function renderGSearch(q) {
  const dd = document.getElementById("gSearchDropdown");
  if(!gSearchResults.length) {
    dd.innerHTML = `<div class="gsearch-empty">Geen resultate vir "${q}"</div>`;
    dd.classList.add("open"); return;
  }

  const grouped = {};
  gSearchResults.forEach(r => {
    if(!grouped[r.type]) grouped[r.type]=[];
    grouped[r.type].push(r);
  });

  gSearchActive = -1;
  dd.innerHTML = Object.entries(grouped).map(([type, items]) => {
    const tc = TYPE_COLORS[type] || {bg:"#f1f5f9",color:"#374151",icon:"&#128269;"};
    const rows = items.map((item, idx) => {
      const globalIdx = gSearchResults.indexOf(item);
      return `<div class="gsearch-result" data-idx="${globalIdx}" onclick="selectGSearch(${globalIdx})">
        <div class="gsearch-result-icon" style="background:${tc.bg};color:${tc.color}">${tc.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="gsearch-result-label">${highlight(item.label, q)}</div>
          <div class="gsearch-result-sub">${highlight(item.sub, q)}</div>
        </div>
        <span class="gsearch-result-badge" style="background:${tc.bg};color:${tc.color}">${type}</span>
      </div>`;
    }).join("");
    return `<div class="gsearch-group-label">${type}</div>${rows}`;
  }).join("");

  dd.classList.add("open");
}

function selectGSearch(idx) {
  const item = gSearchResults[idx];
  if(!item) return;
  closeGSearch();
  document.getElementById("gSearchInput").value = "";

  // Navigate to correct page
  showPage(item.page);

  setTimeout(()=>{
    // Switch bates tab if needed
    if(item.tab) {
      switchBatesTab(item.tab);
      setTimeout(()=>highlightItem(item), 400);
    } else {
      highlightItem(item);
    }
  }, 300);
}

function highlightItem(item) {
  // Clear previous flashes
  document.querySelectorAll(".card-flash,.eq-card-flash,.veh-card-flash,.trac-card-flash").forEach(el=>{
    el.classList.remove("card-flash","eq-card-flash","veh-card-flash");
  });

  const allCards = document.querySelectorAll(".eq-card, .veh-card, .trac-card, .ot-card");
  let found = null;
  const q = item.label.toLowerCase();

  allCards.forEach(card=>{
    if(found) return;
    const nameEl = card.querySelector(".eq-card-name,.veh-card-name,.trac-card-name,.ot-name");
    if(!nameEl) return;
    const cardText = nameEl.textContent.trim().toLowerCase();
    if(cardText.includes(q.slice(0,20)) || q.includes(cardText.slice(0,20))){
      found = card;
    }
  });

  if(!found) return;

  // Jump immediately then flash
  found.scrollIntoView({behavior:"smooth", block:"center"});

  // Flash using CSS class (overrides all existing styles)
  const flashClass = found.classList.contains("eq-card") ? "eq-card-flash"
                   : found.classList.contains("veh-card") ? "veh-card-flash"
                   : found.classList.contains("trac-card") ? "trac-card-flash"
                   : "card-flash";

  setTimeout(()=>{
    found.classList.add(flashClass);
    // Remove after 3 seconds
    setTimeout(()=> found.classList.remove(flashClass), 3000);
  }, 600);
}

function onGSearchKey(e) {
  const dd = document.getElementById("gSearchDropdown");
  const results = dd.querySelectorAll(".gsearch-result");
  if(e.key==="ArrowDown") {
    gSearchActive = Math.min(gSearchActive+1, results.length-1);
  } else if(e.key==="ArrowUp") {
    gSearchActive = Math.max(gSearchActive-1, 0);
  } else if(e.key==="Enter" && gSearchActive>=0) {
    selectGSearch(parseInt(results[gSearchActive].dataset.idx));
    return;
  } else if(e.key==="Escape") {
    clearGSearch(); return;
  } else return;
  results.forEach((r,i)=>r.style.background = i===gSearchActive?"#f5f2eb":"");
  if(results[gSearchActive]) results[gSearchActive].scrollIntoView({block:"nearest"});
}

function closeGSearch() {
  document.getElementById("gSearchDropdown").classList.remove("open");
  gSearchResults = []; gSearchActive = -1;
}

function clearGSearch() {
  document.getElementById("gSearchInput").value = "";
  document.getElementById("gSearchClear").style.display = "none";
  closeGSearch();
  // As Arbeid-bladsy aktief is, hervat normale aansig
  if(document.getElementById("arbeid-dashboard-view")) {
    renderArbeidSoekResultate("");
  }
}

document.addEventListener("click", e => {
  if(!e.target.closest(".gsearch-wrap")) closeGSearch();
});

// Cmd/Ctrl+K to focus search
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("gSearchInput")?.focus();
  }
  if(e.key === "/" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    document.getElementById("gSearchInput")?.focus();
  }
});

const TRAC_AFD_CLASS = {
  "Saaie en Meganies":"tafd-saai",
  "Suiwel":"tafd-suiwel",
  "Wingerd":"tafd-wingerd",
  "Stukkend":"tafd-stukkend"
};

const KLAS_ORDER = ["Trekker","Trekker <90kw","Virk trekker","Parsmasjien","Kerwer","Selflooperspuit","Digger","Macdon","Lorrie"];

function buildTractorGrid(data){
  const grid = document.getElementById("tracGrid");
  if(!grid) return;
  const grouped = {};
  data.forEach(t=>{
    if(!grouped[t.klassifikasie]) grouped[t.klassifikasie]=[];
    grouped[t.klassifikasie].push(t);
  });
  const klasse = KLAS_ORDER.filter(k=>grouped[k]).concat(Object.keys(grouped).filter(k=>!KLAS_ORDER.includes(k)).sort());
  grid.innerHTML = klasse.map(klas=>{
    const items = grouped[klas];
    const cards = items.map(t=>{
      const afdCls = TRAC_AFD_CLASS[t.afdeling]||"";
      return `<div class="trac-card ${afdCls}"
        data-klas="${t.klassifikasie}"
        data-afd="${t.afdeling}"
        data-plaas="${t.plaas}"
        data-verant="${t.verantwoordelike}">
        <div class="trac-card-code">${t.code}</div>
        <div class="trac-card-name">${t.name}</div>
        <div class="trac-card-row">&#128205; ${t.plaas}</div>
        <div class="trac-card-row">&#128100; ${t.verantwoordelike}</div>
        <div class="trac-card-row">&#128197; ${t.jaar} &nbsp;&middot;&nbsp; Aangekoop: ${t.aankoop}</div>
        <div class="trac-card-divider"></div>
        <div style="margin-top:8px">
          <div class="trac-stat-box">
            <div class="trac-stat-box-n">${t.kw_str}</div>
            <div class="trac-stat-box-l">Enjin krag</div>
          </div>
        </div>
        <div class="trac-afd-badge">${t.afdeling}</div>
      </div>`;
    }).join("");
    return `<div class="trac-section" id="tsec-${klas.replace(/[^a-zA-Z0-9]/g,'-')}">
      <div class="trac-section-hdr">
        <span class="trac-section-title">${klas}</span>
        <span class="trac-section-count">${items.length}</span>
        <div class="trac-section-line"></div>
      </div>
      <div class="trac-cards">${cards}</div>
    </div>`;
  }).join("");
  updateTracStats(data.length);
}

function updateTracStats(visible){
  const el=document.getElementById("tracStats");
  if(!el)return;
  const total=TRAC_DATA.length;
  el.innerHTML=[
    {n:visible===total?total:visible+"/"+total,l:"Trekkers & Masjiene"},
    {n:[...new Set(TRAC_DATA.map(t=>t.klassifikasie))].length,l:"Klassifikasies"},
    {n:[...new Set(TRAC_DATA.map(t=>t.afdeling))].length,l:"Afdelings"},
    {n:[...new Set(TRAC_DATA.map(t=>t.verantwoordelike))].length,l:"Verantwoordelikes"},
  ].map(s=>`<div><div style="font-size:22px;font-weight:700;color:#14532d;line-height:1">${s.n}</div><div style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-top:2px">${s.l}</div></div>`).join("");
}

function filterTractors(){
  const klas=document.getElementById("tfKlas")?.value||"";
  const ver=tracPersonFilter;
  const q=(document.getElementById("tracSearch")?.value||"").trim().toLowerCase();
  let visible=0;
  document.querySelectorAll(".trac-card").forEach(card=>{
    const name=card.querySelector(".trac-card-name")?.textContent.toLowerCase()||"";
    const code=card.querySelector(".trac-card-code")?.textContent.toLowerCase()||"";
    const show=(!klas||card.dataset.klas===klas)
            &&(!ver||card.dataset.verant===ver)
            &&(!q||name.includes(q)||code.includes(q));
    card.classList.toggle("hidden",!show);
    if(show)visible++;
  });
  document.querySelectorAll(".trac-section").forEach(sec=>{
    const any=Array.from(sec.querySelectorAll(".trac-card")).some(c=>!c.classList.contains("hidden"));
    sec.classList.toggle("all-hidden",!any);
  });
  const empty=document.getElementById("tracEmpty");
  const grid=document.getElementById("tracGrid");
  if(empty&&grid){
    empty.style.display = visible===0 ? "flex" : "none";
    grid.style.display  = visible===0 ? "none" : "";
  }
  updateTracStats(visible);
}

function resetTracFilters(){
  tracPersonFilter = '';
  ["tfKlas","tracSearch"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
  document.querySelectorAll(".bpill[id^='tracP-']").forEach(b=>b.classList.remove("active"));
  const ap=document.getElementById("tracP-all"); if(ap) ap.classList.add("active");
  filterTractors();
}

  const frikkieLi = document.getElementById("li-frikkie");
  const cornelisLi= document.getElementById("li-cornelis");
  const rikusLi   = document.getElementById("li-rikus");
  const dianLi    = document.getElementById("li-dian");
  const erikLi    = document.querySelector("li[data-afd='erik']");
  const frikanLi  = document.querySelector("li[data-afd='frihan']");
  const dirLis    = document.querySelectorAll("li[data-afd='direksie']");

  if(filter === "wingerd"){
    if(frikanLi)  frikanLi.style.display  = "none";
    dirLis.forEach(l=>l.style.display="none");
    if(frikkieLi) frikkieLi.style.display = "none";
  } else if(filter === "graan"){
    if(frikanLi)  frikanLi.style.display  = "none";
    dirLis.forEach(l=>l.style.display="none");
    if(davidLi)   davidLi.style.display   = "none";
  } else if(filter === "finansies"){
    if(erikLi)    erikLi.style.display    = "none";
    dirLis.forEach(l=>l.style.display="none");
    if(cornelisLi) cornelisLi.style.display = "none";
    if(rikusLi)   rikusLi.style.display   = "none";
    if(dianLi)    dianLi.style.display    = "none";
  }
  setTimeout(updateConnectors, 50);
}

// Fix connector classes after show/hide changes
function updateConnectors(){
  document.querySelectorAll(".ot-root ul").forEach(ul=>{
    const visible = Array.from(ul.children).filter(li=>li.style.display !== "none");
    visible.forEach((li,i)=>{
      li.classList.remove("ot-li-first","ot-li-last","ot-li-only");
      if(visible.length === 1) li.classList.add("ot-li-only");
      else {
        if(i===0) li.classList.add("ot-li-first");
        if(i===visible.length-1) li.classList.add("ot-li-last");
      }
    });
  });
}



function collapseToRoot(){
  const root = document.querySelector(".ot-root > ul > li");
  if(!root) return;
  const childUl = root.querySelector(":scope > ul");
  if(childUl){ collapseAll(childUl); childUl.classList.remove("ot-collapsed"); }
  const card = root.querySelector(":scope > .ot-card");
  if(card) card.classList.add("ot-expanded");
  // Update vlak buttons
  document.querySelectorAll("[id^='btn-vlak-']").forEach(b=>b.classList.remove("active"));
  const db = document.getElementById("btn-vlak-1");
  if(db) db.classList.add("active");
  setTimeout(updateConnectors,50);
}


function setLevel(level, btn){
  document.querySelectorAll("[id^='btn-vlak-']").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");

  // First collapse everything
  document.querySelectorAll(".ot-root ul").forEach(ul=>ul.classList.add("ot-collapsed"));
  document.querySelectorAll(".ot-card").forEach(c=>c.classList.remove("ot-expanded"));

  // Always expand company
  const companyLi = document.querySelector(".ot-company")?.closest("li");
  if(companyLi){
    const ul = companyLi.querySelector(":scope > ul");
    if(ul) ul.classList.remove("ot-collapsed");
    document.querySelector(".ot-company")?.classList.add("ot-expanded");
  }

  // Map level to depth
  const depth = {'1':1, '2':2, '3':3, '4':4, '5':9}[level] || 1;

  // Expand to depth
  let current = [companyLi];
  for(let d=1; d<depth; d++){
    const next = [];
    current.forEach(li=>{
      if(!li) return;
      const children = li.querySelectorAll(":scope > ul > li");
      children.forEach(child=>{
        const childUl = child.querySelector(":scope > ul");
        const childCard = child.querySelector(":scope > .ot-card");
        if(childUl){
          childUl.classList.remove("ot-collapsed");
          if(childCard) childCard.classList.add("ot-expanded");
        }
        next.push(child);
      });
    });
    current = next;
  }
  setTimeout(updateConnectors, 50);
}

// BESTUURSENTRUM API — Live data van Google Sheet
// 6-uur kas (selfde patroon as Oostagri PO)
// Sheet-data vervang hardcoded data direk — geen samesmelt
// ════════════════════════════════════════════════════════════

const BS_API  = 'https://script.google.com/macros/s/AKfycbyg98_7iL163zv_V5n-Axs6A71VFgy1JcT5vqdn75-SFdNdgeBuh7YyEp-YqpAJIcWe7w/exec';
const BS_KEY  = 'bs_data_v1';
const BS_TTL  = 6 * 60 * 60 * 1000; // 6 uur

function bsLeesKas() {
  try {
    const r = JSON.parse(localStorage.getItem(BS_KEY) || 'null');
    if (!r || Date.now() - r.ts > BS_TTL) return null;
    return r.data;
  } catch { return null; }
}
function bsSkryfKas(data) {
  try { localStorage.setItem(BS_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

// ── Vertaal Sheet-velde na die formaat wat die grids verwag ──
function sheetNaImpl(s) {
  // Sheet: {id, naam, klassifikasie, afdeling, plaas, verantwoordelike}
  return { code: s.id || '', name: s.naam, classification: s.klassifikasie,
           afdeling: s.afdeling, plaas: s.plaas, verantwoordelike: s.verantwoordelike };
}
function sheetNaTrek(s) {
  // Sheet: {id, naam, klassifikasie, afdeling, plaas, verantwoordelike}
  return { code: s.id || '', name: s.naam, klassifikasie: s.klassifikasie,
           afdeling: s.afdeling, plaas: s.plaas, verantwoordelike: s.verantwoordelike,
           hours_str: '—', kw_str: '—', jaar: '—', aankoop: '—', hours: 0 };
}
function sheetNaVoert(s) {
  // Sheet: {id, naam, klas, afdeling, plaas, verantwoordelike}
  return { code: s.id || '', name: s.naam, klas: s.klas,
           afdeling: s.afdeling, plaas: s.plaas, verantwoordelike: s.verantwoordelike,
           km_str: '—', repair_str: '—', jaar: '—', aankoop: '—', km: 0, repair: 0 };
}

function pasToeData(data) {
  if (data.equipment?.length)
    EQ_DATA.splice(0, EQ_DATA.length, ...data.equipment.map(sheetNaImpl));
  if (data.tractors?.length)
    TRAC_DATA.splice(0, TRAC_DATA.length, ...data.tractors.map(sheetNaTrek));
  if (data.vehicles?.length)
    VEH_DATA.splice(0, VEH_DATA.length, ...data.vehicles.map(sheetNaVoert));
  if (data.employees?.length)
    ARBEID_DATA = data.employees;

  // Herbou aktiewe Bates-tab
  const t = document.querySelector('.bates-tab.active')?.id?.replace('tab-','');
  if (t === 'equipment') buildEquipmentGrid(EQ_DATA);
  else if (t === 'tractors') buildTractorGrid(TRAC_DATA);
  else if (t === 'vehicles') buildVehicleGrid(VEH_DATA);

  // Herbou Arbeid indien aktief
  if (data.employees?.length && document.getElementById('arbeid-dashboard-view'))
    buildArbeidGrid(data.employees);

  dateerStatistieke(data);
  bsToonStatus(data.timestamp, false);
}

function dateerStatistieke(data){
  const stel=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  if(data.employees){
    stel('stat-werknemers',  data.employees.filter(e=>e.tipe==='Werknemer').length);
    stel('stat-kontrakteurs',data.employees.filter(e=>e.tipe==='Kontrakteur').length);
  }
  if(data.equipment) stel('stat-implemente', data.equipment.length);
  if(data.tractors)  stel('stat-trekkers',   data.tractors.length);
  if(data.vehicles)  stel('stat-voertuie',   data.vehicles.length);
}

function initHome(){
  const kas = bsLeesKas();
  if(kas){ dateerStatistieke(kas); return; }
  const stel=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  stel('stat-implemente', EQ_DATA.length);
  stel('stat-trekkers',   TRAC_DATA.length);
  stel('stat-voertuie',   VEH_DATA.length);
}

function bsToonStatus(ts, offline) {
  const el = document.getElementById('data-status');
  if (!el) return;
  if (offline) {
    el.textContent = '⚠ Offline'; el.style.color='#f59e0b';
  } else {
    const tyd = new Date(ts||Date.now()).toLocaleTimeString('af-ZA',{hour:'2-digit',minute:'2-digit'});
    el.textContent = '✓ Live ' + tyd; el.style.color='#4ade80';
  }
}

async function laaiLiveData(forseer = false) {
  if (!forseer) {
    const kas = bsLeesKas();
    if (kas) { pasToeData(kas); return; }
  }
  try {
    const res  = await fetch(BS_API + '?action=getAllData');
    const json = await res.json();
    if (json.success) { bsSkryfKas(json); pasToeData(json); }
    else throw new Error(json.error);
  } catch { bsToonStatus(null, true); }
}

function verfrisData() {
  const el = document.getElementById('data-status');
  if (el) { el.textContent='⟳ Laai...'; el.style.color='#94a3b8'; }
  laaiLiveData(true);
}

function initCollapsibleTree(){
  // Find all li's with both a card and a child ul
  // Mark worker/contract li's for compact spacing
  document.querySelectorAll(".ot-root li").forEach(li => {
    const card = li.querySelector(":scope > .ot-card");
    if(card && card.classList.contains("ot-worker")) li.classList.add("ot-li-worker");
    if(card && card.classList.contains("ot-contract")) li.classList.add("ot-li-contract");
  });
  document.querySelectorAll(".ot-root li").forEach(li => {
    const childUl = li.querySelector(":scope > ul");
    const card = li.querySelector(":scope > .ot-card");
    if(!childUl || !card) return;

    // Collapse by default (except root company card)
    if(!card.classList.contains("ot-company")){
      childUl.classList.add("ot-collapsed");
    }

    // Count direct children
    const childCount = childUl.querySelectorAll(":scope > li").length;

    // Add expand button to card
    card.classList.add("ot-expandable");
    const btn = document.createElement("div");
    btn.className = "ot-expand-btn";
    btn.innerHTML = `<span class="ot-expand-arrow">▾</span> <span class="ot-expand-count">${childCount} persone</span>`;
    card.appendChild(btn);

    // Click handler
    card.addEventListener("click", e => {
      e.stopPropagation();
      const isOpen = !childUl.classList.contains("ot-collapsed");
      if(isOpen){
        // Collapse this and all descendants
        collapseAll(childUl);
        childUl.classList.add("ot-collapsed");
        card.classList.remove("ot-expanded");
      } else {
        childUl.classList.remove("ot-collapsed");
        card.classList.add("ot-expanded");
      }
      setTimeout(updateConnectors, 50);
    });
  });

  // Auto-expand company (root) and show directors
  const companyCard = document.querySelector(".ot-company");
  if(companyCard){
    const li = companyCard.closest("li");
    const childUl = li?.querySelector(":scope > ul");
    if(childUl){ childUl.classList.remove("ot-collapsed"); companyCard.classList.add("ot-expanded"); }
  }

  updateConnectors();
}

function collapseAll(ul){
  ul.querySelectorAll("ul").forEach(u => u.classList.add("ot-collapsed"));
  ul.querySelectorAll(".ot-card").forEach(c => c.classList.remove("ot-expanded"));
}

function expandToLevel(level){
  let current = [document.querySelector(".ot-root > ul > li")];
  // First collapse all
  const rootUl = document.querySelector(".ot-root > ul > li > ul");
  if(rootUl){ collapseAll(rootUl); rootUl.classList.remove("ot-collapsed"); }
  const rootCard = document.querySelector(".ot-root > ul > li > .ot-card");
  if(rootCard) rootCard.classList.add("ot-expanded");
  // Then expand to desired level
  for(let d=0; d<level; d++){
    const next = [];
    current.forEach(li=>{
      const ul = li.querySelector(":scope > ul");
      const card = li.querySelector(":scope > .ot-card");
      if(ul){ ul.classList.remove("ot-collapsed"); if(card) card.classList.add("ot-expanded"); }
      (ul?.querySelectorAll(":scope > li") || []).forEach(c=>next.push(c));
    });
    current = next;
  }
  // Update active button
  const btnMap = {1:"btn-vlak-1",2:"btn-vlak-2",3:"btn-vlak-3",4:"btn-vlak-4",9:"btn-vlak-5"};
  document.querySelectorAll("[id^='btn-vlak-']").forEach(b=>b.classList.remove("active"));
  const active = document.getElementById(btnMap[level]);
  if(active) active.classList.add("active");
  setTimeout(updateConnectors,50);
}

showPage("home");
laaiLiveData(); // Agtergrond — nie-blokkerend
